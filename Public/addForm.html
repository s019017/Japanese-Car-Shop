<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1 style="margin-left:2vw;" class="headerTitle">Add Form</h1>
    </div>
    <br><br>
    <button class="addToCartBtn" style="width:10vw;margin-left: 2vw;font-size: 2vw;">Back</button>
    <br><br>
    <form id="addForm" style="margin-left:2vw">
        <label>Make<br>
            <input id="make" required>
        </label><br><br>

        <label>Model<br>
            <input id="model" required>
        </label><br><br>

        <label>Price<br>
            <input id="price" type="number" 
            step="0.01" min="0" required>
        </label><br><br>

        <label>Horsepower<br>
            <input id="hp" type="number" min="0" required>
        </label><br><br>

        <label>Torque<br>
            <input id="torque" type="number" min="0" required>
        </label><br><br>

        <label>Start Year<br>
            <input id="startYear" type="number" min="0" required>
        </label><br><br>

        <label>End Year<br>
            <input id="endYear" type="number" min="0" required>
        </label><br><br>

        <label>Top Speed<br>
            <input id="topSpeed" type="number" min="0" required>
        </label><br><br>

        <label>Stock<br>
            <input id="stock" type="number" min="0" value="0">
        </label><br><br>

        <button type="submit" class="addToCartBtn" style="width:9vw">Add product</button>
    </form>
    <p id="message"></p>
</body>
<script src="addForm.js"></script>
<script>
    document.querySelector(".addToCartBtn").addEventListener('click',() => {
        history.back()
    })
</script>
</html>
